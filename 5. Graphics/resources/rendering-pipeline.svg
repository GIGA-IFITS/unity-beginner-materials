<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title description">
  <title id="title">Simplified Unity rendering pipeline</title>
  <desc id="description">Scene objects pass through camera visibility, materials and lighting, and become the final screen image.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b2d"/>
      <stop offset="1" stop-color="#1d334d"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3478c9"/>
      <stop offset="1" stop-color="#245493"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#07111e" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#80c7ff"/>
    </marker>
  </defs>

  <rect width="1400" height="360" rx="28" fill="url(#background)"/>
  <text x="700" y="58" fill="#ffffff" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle">A Frame Through Unity's Rendering Pipeline</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="120" width="260" height="150" rx="20" fill="url(#box)" stroke="#69b7f5" stroke-width="2"/>
    <text x="190" y="184" fill="#ffffff" font-size="28" font-weight="700">Scene Objects</text>
    <text x="190" y="224" fill="#d8eeff" font-size="20">Meshes and Sprites</text>

    <rect x="400" y="120" width="260" height="150" rx="20" fill="url(#box)" stroke="#69b7f5" stroke-width="2"/>
    <text x="530" y="184" fill="#ffffff" font-size="28" font-weight="700">Camera</text>
    <text x="530" y="224" fill="#d8eeff" font-size="20">Visibility and Layers</text>

    <rect x="740" y="120" width="260" height="150" rx="20" fill="url(#box)" stroke="#69b7f5" stroke-width="2"/>
    <text x="870" y="176" fill="#ffffff" font-size="28" font-weight="700">Surface Rules</text>
    <text x="870" y="214" fill="#d8eeff" font-size="20">Materials, Shaders,</text>
    <text x="870" y="242" fill="#d8eeff" font-size="20">Textures, and Lights</text>

    <rect x="1080" y="120" width="260" height="150" rx="20" fill="#167f78" stroke="#6de2d7" stroke-width="2"/>
    <text x="1210" y="184" fill="#ffffff" font-size="28" font-weight="700">Screen Image</text>
    <text x="1210" y="224" fill="#d8fff9" font-size="20">The Final Frame</text>
  </g>

  <g fill="none" stroke="#80c7ff" stroke-width="7" marker-end="url(#arrow)">
    <path d="M 330 195 H 382"/>
    <path d="M 670 195 H 722"/>
    <path d="M 1010 195 H 1062"/>
  </g>

  <text x="700" y="324" fill="#9fc6e5" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Each stage influences what the player sees and how much work the GPU performs.</text>
</svg>
